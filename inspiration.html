<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspiration of the Day — 365 Days | Around the U.S.</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fdfdfc; color: #161616; font-family: Georgia, 'Times New Roman', serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 34px 22px 48px; }
  header { text-align: center; padding-top: 54px; }
  header h1 { margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 36px; color: #111; }
  .tagline { margin-top: 8px; font-family: Arial, Helvetica, sans-serif; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: #666; }
  .back { margin-top: 12px; font-family: Arial, Helvetica, sans-serif; font-size: 12.5px; }
  .back a { color: #161616; text-decoration: underline; text-underline-offset: 2px; }
  .months { text-align: center; margin: 22px 0 4px; font-family: Arial, Helvetica, sans-serif; font-size: 13px; line-height: 2.1; color: #999; }
  .months a { color: #161616; text-decoration: none; padding: 2px 2px; }
  .months a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .day { border-bottom: 1px solid #e9e7e1; padding: 20px 0; }
  .day .d { font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: #8a8a8a; margin-bottom: 4px; }
  .day .theme { font-family: Arial, Helvetica, sans-serif; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: #aaa; margin-bottom: 6px; }
  .day .v { font-size: 17.5px; line-height: 1.6; color: #222; }
  .day .r { margin-top: 7px; font-family: Arial, Helvetica, sans-serif; font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: #555; }
  footer { border-top: 1px solid #ddd; margin-top: 40px; padding-top: 16px; font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; text-align: center; color: #999; }

  .menubtn { position: fixed; top: 20px; left: 20px; z-index: 80; font-family: Arial, Helvetica, sans-serif; font-size: 17px; line-height: 1; background: #fff; color: #111; border: 1px solid #cfcfcf; border-radius: 3px; padding: 8px 11px; cursor: pointer; box-shadow: 0 1px 5px rgba(0,0,0,.10); }
  .menubtn:hover { background: #111; color: #fff; border-color: #111; }
  .scrim { display: none; position: fixed; inset: 0; background: rgba(20,20,20,.42); z-index: 85; }
  .scrim.open { display: block; }
  .drawer { position: fixed; top: 0; left: 0; height: 100%; width: 272px; max-width: 84vw; background: #fff; border-right: 1px solid #e2e2e2; z-index: 90; transform: translateX(-105%); transition: transform .28s ease; padding: 16px 0 26px; overflow-y: auto; text-align: left; }
  .drawer.open { transform: translateX(0); box-shadow: 0 0 30px rgba(0,0,0,.22); }
  .drawer-head { display: flex; justify-content: flex-end; padding: 0 16px 8px; }
  .drawer-x { font-family: Arial, Helvetica, sans-serif; font-size: 13px; background: none; color: #555; border: none; padding: 4px 6px; cursor: pointer; }
  .drawer-x:hover { color: #111; }
  .drawer a { display: block; padding: 11px 22px; color: #161616; text-decoration: none; font-family: Arial, Helvetica, sans-serif; font-size: 15px; }
  .drawer a:hover { background: #f7f6f2; }
  .drawer a.active { font-weight: 700; box-shadow: inset 3px 0 0 #111; background: #f7f6f2; }
  .menu-row { display: flex; gap: 8px; padding: 18px 22px 4px; margin-top: 14px; border-top: 1px solid #eee; }
  .menu-row button { font-family: Arial, Helvetica, sans-serif; font-size: 12px; background: #fff; color: #161616; border: 1px solid #c9c9c9; border-radius: 3px; padding: 6px 11px; cursor: pointer; }
  .menu-row button.active { background: #111; color: #fff; border-color: #111; }
  body.dark .menubtn { background: #171717; color: #eee; border-color: #3a3a3a; box-shadow: none; }
  body.dark .menubtn:hover { background: #eee; color: #111; }
  body.dark .drawer { background: #141414; border-right-color: #2b2b2b; }
  body.dark .drawer-x { color: #9a9a9a; }
  body.dark .drawer a { color: #e9e9e9; }
  body.dark .drawer a:hover, body.dark .drawer a.active { background: #1e1e1e; }
  body.dark .drawer a.active { box-shadow: inset 3px 0 0 #e9e9e9; }
  body.dark .menu-row { border-top-color: #2b2b2b; }
  body.dark .menu-row button { background: #171717; color: #e9e9e9; border-color: #3d3d3d; }
  body.dark .menu-row button.active { background: #e9e9e9; color: #111; border-color: #e9e9e9; }

  body.font-s .story-note { font-size: 14px; }
  body.font-l .story-note { font-size: 19px; }
  body.font-s .teaser-title { font-size: 19px; }
  body.font-l .teaser-title { font-size: 25px; }
  body.font-s .story-title { font-size: 18px; }
  body.font-l .story-title { font-size: 24px; }
  body.font-s .topstory-title { font-size: 30px; }
  body.font-l .topstory-title { font-size: 42px; }
  body.font-s .inspiration p { font-size: 12px; }
  body.font-l .inspiration p { font-size: 16px; }
  body.font-s .day .v { font-size: 15px; }
  body.font-l .day .v { font-size: 20px; }

  body.dark { background: #101010; color: #e9e9e9; }
  body.dark header h1 { color: #f4f4f4; }
  body.dark .tagline { color: #9a9a9a; }
  body.dark .back a { color: #e9e9e9; }
  body.dark .months { color: #555; }
  body.dark .months a { color: #e9e9e9; }
  body.dark .day { border-bottom-color: #262626; }
  body.dark .day .d { color: #7d7d7d; }
  body.dark .day .theme { color: #666; }
  body.dark .day .v { color: #dedede; }
  body.dark .day .r { color: #a5a5a5; }
  body.dark footer { border-top-color: #262626; color: #6f6f6f; }
  @media (max-width: 640px) { .wrap { padding: 26px 16px 40px; } header h1 { font-size: 29px; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
</head>
<body>
<main class="wrap">
  <header>
    <h1>Inspiration of the Day</h1>
    <div class="tagline">365 Days &bull; King James Version</div>
    <div class="back"><a href="index.html">&larr; Back to Around the U.S.</a></div>
  </header>
  <button class="menubtn" id="menuBtn" aria-label="Open menu" onclick="ausMenu(event)">&#9776;</button><div class="scrim" id="ausScrim" onclick="ausMenu()"></div><aside class="drawer" id="ausMenu">
<div class="drawer-head"><button class="drawer-x" aria-label="Close menu" onclick="ausMenu()">&#10005;</button></div>
<a href="index.html">Front Page</a>
<a href="texas.html">Texas</a>

<a href="across-us.html">Across the U.S.</a>

<div class="menu-row"><button id="themeBtn" onclick="ausTheme()">&#9790; Dark</button><button data-fs="s" onclick="ausFont('s')">A&#8722;</button><button data-fs="m" onclick="ausFont('m')">A</button><button data-fs="l" onclick="ausFont('l')">A+</button></div>
</aside>

  <nav class="months" id="monthnav"></nav>
  <div id="year"></div>

  <footer>One verse for every day of the year &mdash; Around the U.S.</footer>
</main>
<script src="inspirations.js"></script>
<script>
  var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAYS = [31,28,31,30,31,30,31,31,30,31,30,31];
  var nav = document.getElementById('monthnav');
  var year = document.getElementById('year');
  MONTH_NAMES.forEach(function(name, i){
    var a = document.createElement('a');
    a.href = '#m' + (i+1);
    a.textContent = name;
    nav.appendChild(a);
    nav.appendChild(document.createTextNode(' \u00B7 '));
  });
  MONTH_NAMES.forEach(function(name, i){
    var m = i + 1;
    var sec = document.createElement('section');
    sec.id = 'm' + m;
    var h = document.createElement('h2');
    h.textContent = name;
    sec.appendChild(h);
    var th = document.createElement('div');
    th.className = 'theme';
    th.textContent = (window.INSPIRATION_THEMES || {})[m] || '';
    sec.appendChild(th);
    function addDay(dayNum, label){
      var e = (window.INSPIRATIONS || {})[m + '-' + dayNum];
      if (!e) return;
      var div = document.createElement('div');
      div.className = 'day';
      var d = document.createElement('div');
      d.className = 'd';
      d.textContent = label;
      var v = document.createElement('p');
      v.className = 'v';
      v.textContent = e.v;
      var r = document.createElement('div');
      r.className = 'r';
      r.textContent = e.r + ' (KJV)';
      div.appendChild(d); div.appendChild(v); div.appendChild(r);
      sec.appendChild(div);
    }
    for (var dnum = 1; dnum <= DAYS[i]; dnum++){
      addDay(dnum, name + ' ' + dnum);
    }
    if (m === 2){ addDay(29, 'February 29 (leap years)'); }
    year.appendChild(sec);
  });
</script>
<script>
(function(){try{var t=localStorage.getItem('aus-theme');if(t==='dark')document.body.classList.add('dark');var f=localStorage.getItem('aus-font');if(f&&f!=='m')document.body.classList.add('font-'+f);}catch(e){}
function mark(){var d=document.body.classList.contains('dark');var tb=document.getElementById('themeBtn');if(tb)tb.innerHTML=d?'&#9728; Light':'&#9790; Dark';var bs=document.querySelectorAll('[data-fs]');for(var i=0;i<bs.length;i++){var fs=bs[i].getAttribute('data-fs');var on=document.body.classList.contains('font-'+fs)||(fs==='m'&&!document.body.classList.contains('font-s')&&!document.body.classList.contains('font-l'));bs[i].classList.toggle('active',on);}}
window.ausTheme=function(){document.body.classList.toggle('dark');try{localStorage.setItem('aus-theme',document.body.classList.contains('dark')?'dark':'light');}catch(e){}mark();};
window.ausFont=function(s){document.body.classList.remove('font-s');document.body.classList.remove('font-l');if(s!=='m')document.body.classList.add('font-'+s);try{localStorage.setItem('aus-font',s);}catch(e){}mark();};
mark();})();
</script>
<script>
window.ausMenu=function(ev){if(ev)ev.stopPropagation();var m=document.getElementById('ausMenu');var s=document.getElementById('ausScrim');if(m)m.classList.toggle('open');if(s)s.classList.toggle('open');};
document.addEventListener('click',function(e){var m=document.getElementById('ausMenu');var s=document.getElementById('ausScrim');var b=document.getElementById('menuBtn');if(m&&m.classList.contains('open')&&!m.contains(e.target)&&e.target!==b&&!(b&&b.contains(e.target))){m.classList.remove('open');if(s)s.classList.remove('open');}});
</script>
</body>
