  .menuwrap { position: relative; text-align: center; margin: 2px 0 16px; }

  .menu a { display: block; padding: 9px 14px; color: #111; text-decoration: none; font-family: Arial, sans-serif; font-size: 14px; border-bottom: 1px solid #ddd; }
  .menu a.active { font-weight: bold; background: #f0f0f0; }
  .menu-row { display: flex; gap: 6px; padding: 8px 14px 12px; }
  .menu-row button { font-family: Arial, sans-serif; font-size: 12px; letter-spacing: 1px; background: #fff; color: #111; border: 2px solid #111; padding: 5px 10px; cursor: pointer; }
  .menu-row button.active { background: #111; color: #fff; }
  body.dark .menubtn { background: #1c1c1c; color: #eee; border-color: #eee; }
  body.dark .menu { background: #1c1c1c; border-color: #eee; box-shadow: 4px 4px 0 #000; }
  body.dark .menu a { color: #eee; border-bottom-color: #444; }
  body.dark .menu a.active { background: #333; }
  body.dark .menu-group { color: #aaa; }
  body.dark .menu-row button { background: #1c1c1c; color: #eee; border-color: #eee; }
  body.dark .menu-row button.active { background: #eee; color: #111; }

  .menubtn { position: fixed; top: 10px; left: 10px; z-index: 80; font-family: Arial, sans-serif; font-size: 13px; letter-spacing: 1px; background: #fff; color: #111; border: 2px solid #111; padding: 7px 12px; cursor: pointer; box-shadow: 2px 2px 0 #111; }
  .scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 85; }
  .scrim.open { display: block; }
  .drawer { position: fixed; top: 0; left: 0; height: 100%; width: 260px; max-width: 82vw; background: #fff; border-right: 2px solid #111; z-index: 90; transform: translateX(-105%); transition: transform .25s ease; padding: 12px 0 20px; overflow-y: auto; text-align: left; }
  .drawer.open { transform: translateX(0); box-shadow: 4px 0 14px rgba(0,0,0,.3); }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 2px 14px 10px; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 18px; color: #111; border-bottom: 3px double #111; margin-bottom: 6px; }
  .drawer-x { font-family: Arial, sans-serif; font-size: 14px; background: #fff; color: #111; border: 2px solid #111; padding: 3px 9px; cursor: pointer; }

  body.dark .drawer { background: #1c1c1c; border-right-color: #eee; }
  body.dark .drawer-head { color: #f2f2f2; border-bottom-color: #eee; }
  body.dark .drawer-x { background: #1c1c1c; color: #eee; border-color: #eee; }
  body.dark .drawer a { color: #eee; border-bottom-color: #444; }

<main class="wrap">

<div class="drawer-head"><span>Around the U.S.</span><button class="drawer-x" onclick="ausMenu()">&#10005;</button></div>

<div class="menu-row"><button id="themeBtn" onclick="ausTheme()">&#9790; Dark</button><button data-fs="s" onclick="ausFont('s')">A&#8722;</button><button data-fs="m" onclick="ausFont('m')">A</button><button data-fs="l" onclick="ausFont('l')">A+</button></div>
</aside>

  <nav class="months" id="monthnav"></nav>
  <div id="year"></div>

  <footer>One verse for every day of the year &mdash; Around the U.S.</footer>
</main>
<script src="inspirations.js"></script>
<script>
  var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAYS = [31,28,31,30,31,30,31,31,30,31,30,31];
  var nav = document.getElementById('monthnav');
  var year = document.getElementById('year');
  MONTH_NAMES.forEach(function(name, i){
    var a = document.createElement('a');
    a.href = '#m' + (i+1);
    a.textContent = name;
    nav.appendChild(a);
    nav.appendChild(document.createTextNode(' \u00B7 '));
  });
  MONTH_NAMES.forEach(function(name, i){
    var m = i + 1;
    var sec = document.createElement('section');
    sec.id = 'm' + m;
    var h = document.createElement('h2');
    h.textContent = name;
    sec.appendChild(h);
    var th = document.createElement('div');
    th.className = 'theme';
    th.textContent = (window.INSPIRATION_THEMES || {})[m] || '';
    sec.appendChild(th);
    function addDay(dayNum, label){
      var e = (window.INSPIRATIONS || {})[m + '-' + dayNum];
      if (!e) return;
      var div = document.createElement('div');
      div.className = 'day';
      var d = document.createElement('div');
      d.className = 'd';
      d.textContent = label;
      var v = document.createElement('p');
      v.className = 'v';
      v.textContent = e.v;
      var r = document.createElement('div');
      r.className = 'r';
      r.textContent = e.r + ' (KJV)';
      div.appendChild(d); div.appendChild(v); div.appendChild(r);
      sec.appendChild(div);
    }
    for (var dnum = 1; dnum <= DAYS[i]; dnum++){
      addDay(dnum, name + ' ' + dnum);
    }
    if (m === 2){ addDay(29, 'February 29 (leap years)'); }
    year.appendChild(sec);
  });
</script>
<script>
(function(){try{var t=localStorage.getItem('aus-theme');if(t==='dark')document.body.classList.add('dark');var f=localStorage.getItem('aus-font');if(f&&f!=='m')document.body.classList.add('font-'+f);}catch(e){}
function mark(){var d=document.body.classList.contains('dark');var tb=document.getElementById('themeBtn');if(tb)tb.innerHTML=d?'&#9728; Light':'&#9790; Dark';var bs=document.querySelectorAll('[data-fs]');for(var i=0;i<bs.length;i++){var fs=bs[i].getAttribute('data-fs');var on=document.body.classList.contains('font-'+fs)||(fs==='m'&&!document.body.classList.contains('font-s')&&!document.body.classList.contains('font-l'));bs[i].classList.toggle('active',on);}}
window.ausTheme=function(){document.body.classList.toggle('dark');try{localStorage.setItem('aus-theme',document.body.classList.contains('dark')?'dark':'light');}catch(e){}mark();};
window.ausFont=function(s){document.body.classList.remove('font-s');document.body.classList.remove('font-l');if(s!=='m')document.body.classList.add('font-'+s);try{localStorage.setItem('aus-font',s);}catch(e){}mark();};
mark();})();
</script>
<script>
window.ausMenu=function(ev){if(ev)ev.stopPropagation();var m=document.getElementById('ausMenu');var s=document.getElementById('ausScrim');if(m)m.classList.toggle('open');if(s)s.classList.toggle('open');};
document.addEventListener('click',function(e){var m=document.getElementById('ausMenu');var s=document.getElementById('ausScrim');var b=document.getElementById('menuBtn');if(m&&m.classList.contains('open')&&!m.contains(e.target)&&e.target!==b&&!(b&&b.contains(e.target))){m.classList.remove('open');if(s)s.classList.remove('open');}});
</script>
